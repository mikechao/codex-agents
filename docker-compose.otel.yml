services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yaml
    volumes:
      - ./.codex/observability/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - otel

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "10000"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14269:14269"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14269/"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - otel

networks:
  otel:
    name: codex-agents-otel
    driver: bridge
